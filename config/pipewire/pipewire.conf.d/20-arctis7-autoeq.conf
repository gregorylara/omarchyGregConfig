# Calibración AutoEq (Curva Harman - Rtings) para SteelSeries Arctis 7+
# Procesamiento de estudio nativo en PipeWire (sin aplicaciones externas ni consumo de CPU)

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Arctis 7+ Hi-Fi (AutoEq Harman)"
            media.name       = "Arctis 7+ Hi-Fi (AutoEq Harman)"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 105.0 "Q" = 0.70 "Gain" = 6.7 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 95.0 "Q" = 0.42 "Gain" = -6.6 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 238.0 "Q" = 1.73 "Gain" = -1.9 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 821.0 "Q" = 0.55 "Gain" = 3.8 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 2837.0 "Q" = 2.18 "Gain" = 2.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_peaking
                        control = { "Freq" = 1337.0 "Q" = 3.89 "Gain" = 0.4 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_7
                        label = bq_peaking
                        control = { "Freq" = 4932.0 "Q" = 5.60 "Gain" = 1.9 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_8
                        label = bq_peaking
                        control = { "Freq" = 5972.0 "Q" = 5.92 "Gain" = -3.7 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_9
                        label = bq_peaking
                        control = { "Freq" = 10000.0 "Q" = 4.62 "Gain" = -0.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_10
                        label = bq_highshelf
                        control = { "Freq" = 10000.0 "Q" = 0.70 "Gain" = -4.5 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "eq_band_10:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.arctis7_autoeq"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "effect_output.arctis7_autoeq"
                node.passive = true
                target.object = "alsa_output.usb-SteelSeries_Arctis_7_-00.analog-stereo"
            }
        }
    }
]
